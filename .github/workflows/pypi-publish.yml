name: Publish to PyPI

on:
  push:
    branches:
      - master
    paths:
      - 'dfimage.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish Target (pypi, dry-run)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - pypi

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          pip install build twine

      - name: Build Package
        run: python -m build

      - name: Check Built Package
        run: twine check dist/*

      - name: Upload Python Package Dist Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-dist
          path: dist

  pypi-publish:
    name: Upload Release to PyPI
    runs-on: ubuntu-latest
    needs: build-wheel
    if: github.event_name == 'push' || github.event.inputs.publish_target == 'pypi'
    environment:
      name: pypi
      url: https://pypi.org/p/dfimage
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download Python Package Dist Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-dist
          path: dist
      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
