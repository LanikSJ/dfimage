# Skills Update Automation
#
# This workflow runs monthly to update skills using the `npm skills update` command
# and creates a pull request with any changes.
#
# Features:
# - Runs every month on the 2nd at 03:00 UTC
# - Updates all skills in the project
# - Creates a PR with changes if any skills have been updated
# - Uses conventional commit format for skill updates
# - Concurrency group prevents race conditions on the update branch
# - Two-job isolation: read-only update job, write-only PR job

name: Skills Update

on:
  schedule:
    # Run every month on the 2nd at 03:00 UTC
    - cron: '0 3 2 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  # Node.js version required by the skills CLI (22.20+)
  NODE_VERSION: '22'

concurrency:
  group: skills-update
  cancel-in-progress: false

jobs:
  # Job 1: Update skills - read-only job
  # Only reads the repository and runs npx skills update.
  # Cannot push or create PRs due to contents: read permission.
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      has_changes: ${{ steps.git-check.outputs.has_changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update Skills
        run: |
          echo "Fetching upstream changes..."
          git fetch origin
          git reset --hard origin/main
          echo "Running npx skills update with fresh resolution..."
          npx skills update --yes

      - name: Check for Changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in skills-lock.json"
            git status --porcelain
          fi

      - name: Remove Local .agents Folder
        run: |
          if [ -d ".agents" ]; then
            echo "Removing local .agents folder (using global .agents configuration)"
            rm -rf .agents
          else
            echo "No local .agents folder found"
          fi

      - name: Upload skills-lock.json
        if: steps.git-check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skills-lock.json
          path: skills-lock.json
          retention-days: 1

  # Job 2: Create Pull Request - write-only job
  # Has write permissions needed to commit and create PRs.
  # Downloads the updated skills-lock.json artifact from Job 1.
  create-pr:
    runs-on: ubuntu-latest
    needs: update-skills
    if: needs.update-skills.outputs.has_changes == 'true'
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download skills-lock.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skills-lock.json
          path: .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: skills-lock.json
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: |
            chore(skills): update skills from npm skills update

            Updated skills based on latest versions available via npm skills update.
            This may include bug fixes, new features, or security patches.
          branch: skills/update-automated
          title: 'chore(skills): update skills from npm skills update'
          body: |
            ## Skills Update

            This PR updates skills via `npm skills update` on automated schedule.

            ### Changes
            - Updated skills-lock.json with latest skill versions
            - May include bug fixes, new features, or security patches

            ### Notes
            - This PR was automatically generated by the Skills Update workflow
            - To disable, remove this workflow from .github/workflows/

          base: master
          draft: false
